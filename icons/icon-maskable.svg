  <g transform="translate(256 256) scale(0.775) translate(-256 -256)">
    <text x="256" y="230" text-anchor="middle" dominant-baseline="middle"
          font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="188" fill="#ffffff">C$</text>
    <polyline points="141,379 210,354 267,371 371,322" fill="none" stroke="#ffffff"
              stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
